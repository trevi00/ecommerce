# 간단한 애플리케이션 설정
spring:
  application:
    name: ecommerce
  
  # 데이터베이스 설정
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  # H2 콘솔 설정
  h2:
    console:
      enabled: true
      path: /h2-console
  
  # Spring Data JDBC 설정
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# 로깅 설정
logging:
  level:
    org.zb.ecommerce: DEBUG
    org.springframework.web: INFO
    org.springframework.jdbc: DEBUG

# 서버 포트
server:
  port: 8080

# JWT 설정
jwt:
  secret: mySecretKey123456789012345678901234567890
  expiration: 86400000