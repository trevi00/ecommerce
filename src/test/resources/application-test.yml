# 테스트 전용 설정
spring:
  application:
    name: ecommerce-test
  
  # 테스트용 인메모리 데이터베이스
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  # H2 설정
  h2:
    console:
      enabled: false
  
  # SQL 초기화 비활성화 (테스트에서 필요시만)
  sql:
    init:
      mode: never

# 로깅 설정 (테스트 시 덜 verbose)
logging:
  level:
    org.zb.ecommerce: INFO
    org.springframework.web: WARN
    org.springframework.jdbc: WARN
    root: WARN

# JWT 설정 (테스트용)
jwt:
  secret: testSecretKey123456789012345678901234567890
  expiration: 3600000